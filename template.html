<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speisekarten</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --success-hover: #15803d;
            --accent-bg: #eff6ff;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px 40px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            max-width: 600px;
            margin: 0 auto 20px;
        }

        .banner-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: var(--radius);
            overflow: hidden;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid var(--border-color);
            padding: 20px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .banner-svg {
            width: 100%;
            max-width: 420px;
            height: auto;
            display: block;
        }

        .filter-container {
            display: flex;
            gap: 8px;
            max-width: 600px;
            margin: 0 auto 24px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .filter-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        @media (min-width: 640px) {
            .grid, .filter-container, header, .banner-container {
                max-width: 900px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card.hidden {
            display: none;
        }

        .card-body {
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: var(--accent-bg);
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 12px;
            border-radius: 10px;
            transition: background-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-pdf {
            background-color: var(--primary);
        }

        .btn-pdf:hover {
            background-color: var(--primary-hover);
        }

        .btn-phone {
            background-color: var(--success);
        }

        .btn-phone:hover {
            background-color: var(--success-hover);
        }

        .no-cards {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="banner-container">
            <svg class="banner-svg" viewBox="0 0 400 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="45" r="35" fill="#2563eb" fill-opacity="0.08" />
                <circle cx="350" cy="45" r="30" fill="#2563eb" fill-opacity="0.06" />
                <rect x="145" y="15" width="45" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
                <line x1="155" y1="28" x2="175" y2="28" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="155" y1="38" x2="170" y2="38" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
                <line x1="155" y1="46" x2="175" y2="46" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
                <line x1="155" y1="54" x2="165" y2="54" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
                <circle cx="225" cy="45" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
                <circle cx="225" cy="45" r="16" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
                <path d="M195 32V44M192 32V38C192 39.6569 193.343 41 195 41C196.657 41 198 39.6569 198 38V32M195 41V58" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
                <path d="M255 32V58M255 32C258.5 32 260 35 260 41V44H255" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M125 25L127 30L132 32L127 34L125 39L123 34L118 32L123 30L125 25Z" fill="#2563eb" fill-opacity="0.3"/>
                <path d="M275 55L276.5 58.5L280 60L276.5 61.5L275 65L273.5 61.5L270 60L273.5 58.5L275 55Z" fill="#2563eb" fill-opacity="0.4"/>
            </svg>
        </div>
    </header>

    <nav class="filter-container">
        <!--FILTER_BUTTONS-->
    </nav>

    <main class="grid">
        <!--CARDS_HTML-->
    </main>

    <script>
        function filterCategory(cat, evt) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            evt.target.classList.add('active');

            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (cat === 'all' || card.getAttribute('data-category') === cat) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
