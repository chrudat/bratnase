<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speisekarten</title>
    
    <!-- Live SVG-Favicon (Pizza Emoji) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
    
    <style>
        /* Light Mode (Standard) */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --success-hover: #15803d;
            --accent-bg: #eff6ff;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);

            /* Banner Gradient */
            --banner-gradient-start: #eff6ff;
            --banner-gradient-end: #dbeafe;
            --banner-svg-card-fill: #ffffff;
            --banner-svg-text-stroke: #64748b;
            --banner-svg-dash-stroke: #e2e8f0;
        }

        /* Dark Mode (Automatisch bei dunklem System-Design) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --primary: #3b82f6;
                --primary-hover: #2563eb;
                --success: #22c55e;
                --success-hover: #16a34a;
                --accent-bg: #1e3a8a;
                --border-color: #334155;
                --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);

                /* Banner Gradient Dark Mode */
                --banner-gradient-start: #1e293b;
                --banner-gradient-end: #0f172a;
                --banner-svg-card-fill: #334155;
                --banner-svg-text-stroke: #94a3b8;
                --banner-svg-dash-stroke: #475569;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px 40px;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        header {
            max-width: 600px;
            margin: 0 auto 20px;
        }

        /* Banner Styling */
        .banner-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: var(--radius);
            overflow: hidden;
            background: linear-gradient(135deg, var(--banner-gradient-start) 0%, var(--banner-gradient-end) 100%);
            border: 1px solid var(--border-color);
            padding: 20px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .banner-svg {
            width: 100%;
            max-width: 420px;
            height: auto;
            display: block;
        }

        .banner-svg rect.banner-card {
            fill: var(--banner-svg-card-fill);
        }

        .banner-svg line.banner-line {
            stroke: var(--banner-svg-text-stroke);
        }

        .banner-svg circle.banner-dash {
            stroke: var(--banner-svg-dash-stroke);
        }

        /* Filter-Buttons Container */
        .filter-container {
            display: flex;
            gap: 8px;
            max-width: 600px;
            margin: 0 auto 24px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .filter-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Layout Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        @media (min-width: 640px) {
            .grid, .filter-container, header, .banner-container {
                max-width: 900px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        /* Kacheln & Inhalt */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card.hidden {
            display: none !important;
        }

        .card-body {
            margin-bottom: 16px;
        }

        .badges-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: var(--accent-bg);
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Actions & Buttons */
        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 12px;
            border-radius: 10px;
            transition: background-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
        }

        .btn span {
            display: inline-block;
            text-align: center;
            word-break: break-word;
        }

        .btn-pdf {
            background-color: var(--primary);
        }

        .btn-pdf:hover {
            background-color: var(--primary-hover);
        }

        .btn-phone {
            background-color: var(--success);
        }

        .btn-phone:hover {
            background-color: var(--success-hover);
        }

        .no-cards {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            font-size: 0.95rem;
            grid-column: 1 / -1;
        }
    </style>
</head>
