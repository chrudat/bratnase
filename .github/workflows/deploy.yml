name: Build, Commit and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

concurrency:
  group: "bratnase-pipeline"
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: index.html mit build.py generieren
        run: python build.py

      - name: Generierte index.html ins Repository committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Keine Änderungen an index.html."
          else
            git commit -m "chore: update index.html"
            git push
          fi

  deploy-pages:
    needs: build-and-commit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aktualisiertes Repository auschecken
        uses: actions/checkout@v4

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Auf GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
