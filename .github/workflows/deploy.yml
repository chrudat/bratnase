name: Build Website for Git Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'index.html'
  workflow_dispatch:

concurrency:
  group: "build-bratnase"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: index.html mit build.py generieren
        run: python build.py

      - name: Generierte index.html ins Repository committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Keine Änderungen an index.html."
          else
            git commit -m "chore: update index.html"
            git push
          fi
