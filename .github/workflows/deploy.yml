name: Build and Deploy to Netcup via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "ftp-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: index.html mit build.py generieren
        run: python build.py

      - name: Dateien per FTP auf Webspace hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Passe den Zielordner auf deinem Webspace an (z. B. /httpdocs/mittag oder /httpdocs)
          server-dir: /httpdocs/
          # Überträgt nur die benötigten Dateien für die Webseite
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            template.html
