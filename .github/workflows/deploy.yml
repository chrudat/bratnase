name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  # Ermöglicht das manuelle Ausführen über den "Actions"-Tab in GitHub
  workflow_dispatch:

# Verhindert parallele Deployments und bricht ältere Läufe automatisch ab
concurrency:
  group: pages
  cancel-in-progress: true

# Setzt notwendige Rechte für den GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: index.html generieren
        run: python build.py

      - name: Artifact für Pages hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
