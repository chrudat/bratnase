name: Build and Deploy Menus to Netcup FTPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Index Page
        run: |
          python build.py
          ls -la

      - name: Deploy to Netcup Webspace via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Netcup-spezifische Stabilitätseinstellungen:
          security-option: explicit
          server-dir: /httpdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .gitkeep
            build.py
